# Copie ce fichier en "secrets.yaml" (à côté de sprout32.yaml) et remplis-le.

wifi_ssid: "NomDuReseauWiFi"
wifi_password: "MotDePasseWiFi"

# Point d'accès de secours (si le Wi-Fi est introuvable)
sprout32__ap_password: "mot-de-passe-secours"

# Clé de chiffrement de l'API Home Assistant (32 octets en base64).
# Génère-en une : openssl rand -base64 32
# (ou laisse l'interface ESPHome en créer une lors de l'ajout d'un nouvel appareil)
sprout32__api_key: "REMPLACER_PAR_UNE_CLE_BASE64"

# Mot de passe des mises à jour OTA (Wi-Fi)
sprout32__ota_password: "mot-de-passe-ota"

# Mot de passe de l'interface web locale (utilisateur : admin)
sprout32__web_password: "mot-de-passe-web"